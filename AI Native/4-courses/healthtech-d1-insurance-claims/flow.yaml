# Health-tech sector course, problem bank D1: insurance claims and rejections.
# Outline and open questions: 5-roadmap/sector-courses/healthtech-d1-insurance-claims.md.

id: flow.healthtech-insurance-claims.udaan-v1
problem: prob.healthtech-insurance-claims
approach: >
  Problem-based, narrative-driven, on the shipped UDAAN shape. Five units, each opening on a
  failure created by the previous unit's success. No jargon until earned. Bikash, an insurance
  desk officer in Nepalgunj, learns to check a claim file against a written checklist and the
  current rules, to cite every flag, to confirm what was read from paper, and to keep the claim
  honest. The course ends on a one-page claim-check sheet. No acronym is proposed yet; one may
  come out of the build. See 1-how-we-built-it/build-manual.md Part III.
status: draft
mode: pedagogy
actor: human

