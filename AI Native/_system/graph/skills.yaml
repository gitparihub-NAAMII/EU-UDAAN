edges:
  # The course chain, as prereq edges between each course's spine skill.
  # vocabulary-map.md §4.3; build manual §1.1 ("each course's opening trap is created by the
  # previous course's success").
  - from: designing-context-aware-ai-systems
    to: agent-design-configuration
    type: prereq
    basis: Course 1 → Course 2 chain (build manual §1.1)
  - from: agent-design-configuration
    to: responsible-ai-use-compliance
    type: prereq
    basis: Course 2 → Course 3 chain (build manual §1.1)

  # BRIEF's landmarks are parts of the brief. Build manual §1.3.
  - from: role-persona-specification
    to: structured-prompt-engineering
    type: part-of
    basis: R — Role is one of the five BRIEF landmarks (build manual §1.3)
  - from: audience-aware-ai-communication
    to: structured-prompt-engineering
    type: part-of
    basis: Audience is part of I — Intent in BRIEF (build manual §1.3, C1 2.3)
  - from: source-grounding-hallucination-control
    to: designing-context-aware-ai-systems
    type: part-of
    basis: Grounding deepens B — Background (build manual §1.3, C1 Unit 4)
  - from: reusable-prompt-framework-design
    to: structured-prompt-engineering
    type: extends
    basis: The reusable one-page BRIEF builds on the structured prompt (build manual §1.3, C1 5.2)

  # AGENT: explicit steps come from decomposition. Build manual §1.4.
  - from: ai-automation-agent-building
    to: task-decomposition-process-design
    type: uses
    basis: E — Explicit steps; the agent runs the decomposed recipe (build manual §1.4, C2 Unit 3)
  - from: automation-judgment-roi
    to: workflow-automation-analysis
    type: co-occurs
    basis: Count the cost / what deserves an agent (build manual §1.4, C2 1.2 and 5.3)

  # TRUST: classify first, paste second. Build manual §1.5, C3 4.4.
  - from: data-sensitivity-classification
    to: confidential-information-handling
    type: prereq
    basis: Classify first, paste second (build manual §1.5, C3 4.4)
  - from: source-grounding-hallucination-control
    to: ai-output-validation-contextual-auditing
    type: co-occurs
    basis: The invented answer is caught by grounding and by tracing (C1 Unit 4, C3 Unit 2)
